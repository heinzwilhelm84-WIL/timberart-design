<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TimberArt Design Studio</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600&family=Bebas+Neue&family=Oswald:wght@400;600&family=Libre+Franklin:wght@400;600&family=Braah+One&family=Lilita+One&family=Playfair+Display:wght@400;600&family=Great+Vibes&family=Lobster&family=Bona+Nova:wght@400;600&family=Boogaloo&family=Pacifico&family=Roboto+Slab:wght@400;600&family=Fredoka:wght@400;600&family=Bubblegum+Sans&family=Lily+Script+One&family=Limelight&family=Libre+Caslon+Text&family=Anton&family=Cinzel:wght@400;600&family=Cinzel+Decorative&family=Permanent+Marker&family=Special+Elite&family=Rye&family=Alfa+Slab+One&family=Black+Ops+One&family=Poppins:wght@400;600&family=Raleway:wght@400;600&family=League+Spartan:wght@400;600&family=Orbitron:wght@400;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f8f8f6;
            color: #333;
        }

        /* Header */
        header {
            background: white;
            border-bottom: 1px solid #e0e0e0;
            padding: 2rem;
            text-align: center;
        }

        header img {
            height: 96px;
            margin-bottom: 1rem;
        }

        header h1 {
            font-size: 28px;
            color: #2d5016;
            margin-bottom: 0.5rem;
        }

        header p {
            color: #666;
            font-size: 14px;
        }

        /* Navigation */
        nav {
            background: white;
            border-bottom: 1px solid #e0e0e0;
            padding: 1rem 2rem;
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            justify-content: center;
        }

        nav button {
            background: none;
            border: 2px solid #e0e0e0;
            padding: 0.5rem 1.5rem;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s ease;
            color: #333;
        }

        nav button:hover {
            border-color: #2d5016;
            color: #2d5016;
        }

        nav button.active {
            background: #2d5016;
            color: white;
            border-color: #2d5016;
        }

        /* Main Content */
        main {
            max-width: 100%;
            padding: 2rem;
        }

        .category-title {
            font-size: 24px;
            color: #2d5016;
            margin-bottom: 2rem;
            text-align: center;
        }

        /* Grid Layouts */
        .grid-5 {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 1.5rem;
            margin-bottom: 3rem;
        }

        .grid-4 {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 1.5rem;
            margin-bottom: 3rem;
        }

        .grid-3 {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1.5rem;
            margin-bottom: 3rem;
        }

        .grid-2 {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 1.5rem;
            margin-bottom: 3rem;
        }

        /* Design Cards */
        .design-card, .font-card {
            background: white;
            border-radius: 8px;
            overflow: hidden;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 1px solid #e0e0e0;
            display: flex;
            flex-direction: column;
        }

        .design-card:hover, .font-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 24px rgba(45, 80, 22, 0.12);
            border-color: #2d5016;
        }

        .design-card img, .font-card .preview {
            width: 100%;
            height: 200px;
            object-fit: contain;
            background: #f9f9f9;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .design-card .info, .font-card .info {
            padding: 1rem;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
        }

        .design-card .name, .font-card .name {
            font-weight: 600;
            color: #2d5016;
            margin-bottom: 0.5rem;
            font-size: 14px;
        }

        .design-card .description, .font-card .description {
            font-size: 13px;
            color: #666;
            line-height: 1.4;
            flex-grow: 1;
        }

        /* Favorites */
        .favorite-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(255, 255, 255, 0.9);
            border: none;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
        }

        .design-card {
            position: relative;
        }

        .favorite-btn:hover {
            background: white;
            transform: scale(1.1);
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: white;
            border-radius: 12px;
            max-width: 800px;
            width: 90%;
            max-height: 90vh;
            overflow-y: auto;
            padding: 2rem;
            position: relative;
        }

        .modal-close {
            position: absolute;
            top: 1rem;
            right: 1rem;
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            color: #666;
        }

        .modal-close:hover {
            color: #2d5016;
        }

        /* Two-Step Modal */
        .modal-step {
            display: none;
        }

        .modal-step.active {
            display: block;
        }

        .modal-step h2 {
            color: #2d5016;
            margin-bottom: 1.5rem;
            font-size: 20px;
        }

        .modal-preview-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .modal-preview-item {
            cursor: pointer;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            padding: 1.5rem;
            text-align: center;
            transition: all 0.2s ease;
            background: #f9f9f9;
        }

        .modal-preview-item:hover {
            border-color: #2d5016;
            background: #f0f8f0;
        }

        .modal-preview-item.selected {
            border-color: #2d5016;
            background: #e8f5e9;
        }

        .modal-preview-item .font-sample {
            font-size: 48px;
            font-weight: 400;
            margin-bottom: 1rem;
            letter-spacing: 1px;
        }

        .modal-preview-item .label {
            font-size: 12px;
            color: #666;
            font-weight: 600;
        }

        /* Form */
        .order-form {
            background: #f9f9f9;
            padding: 1.5rem;
            border-radius: 8px;
            margin-top: 2rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 600;
            color: #333;
            font-size: 14px;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-family: inherit;
            font-size: 14px;
            resize: vertical;
        }

        .form-group textarea {
            min-height: 100px;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #2d5016;
            box-shadow: 0 0 0 3px rgba(45, 80, 22, 0.1);
        }

        /* Buttons */
        .btn-primary {
            background: #2d5016;
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.3s ease;
        }

        .btn-primary:hover {
            background: #1f3610;
        }

        .btn-secondary {
            background: #e0e0e0;
            color: #333;
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.3s ease;
            margin-right: 0.5rem;
        }

        .btn-secondary:hover {
            background: #d0d0d0;
        }

        .modal-buttons {
            display: flex;
            gap: 1rem;
            margin-top: 2rem;
            justify-content: flex-end;
        }

        /* Responsive */
        @media (max-width: 1024px) {
            .grid-5 {
                grid-template-columns: repeat(4, 1fr);
            }
            .grid-4 {
                grid-template-columns: repeat(3, 1fr);
            }
        }

        @media (max-width: 768px) {
            .grid-5, .grid-4, .grid-3 {
                grid-template-columns: repeat(2, 1fr);
            }
            .modal-preview-grid {
                grid-template-columns: 1fr;
            }
            header {
                padding: 1.5rem;
            }
            header img {
                height: 72px;
            }
            main {
                padding: 1rem;
            }
            nav {
                padding: 0.75rem;
                gap: 0.5rem;
            }
            nav button {
                padding: 0.5rem 1rem;
                font-size: 12px;
            }
        }

        @media (max-width: 480px) {
            .grid-5, .grid-4, .grid-3, .grid-2 {
                grid-template-columns: repeat(2, 1fr);
            }
            header h1 {
                font-size: 20px;
            }
            .category-title {
                font-size: 18px;
            }
        }

        .loading {
            text-align: center;
            color: #666;
            padding: 2rem;
        }

        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #e0e0e0;
            border-top-color: #2d5016;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-right: 0.5rem;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <header>
        <img id="logo" src="" alt="TimberArt Logo">
        <h1>TimberArt Design Studio</h1>
        <p>Personalisierte Designs für Holz, Alu & mehr</p>
    </header>

    <nav>
        <button class="nav-btn active" data-category="all">Alle Designs</button>
        <button class="nav-btn" data-category="designs">Design-Kategorien</button>
        <button class="nav-btn" data-category="schriften">🔤 Schriften</button>
        <button class="nav-btn" data-category="favorites">❤️ Favoriten</button>
    </nav>

    <main>
        <div id="content"></div>
    </main>

    <!-- Image Preview Modal -->
    <div id="imageModal" class="modal">
        <div class="modal-content" style="max-width: 700px;">
            <button class="modal-close" onclick="closeImageModal()">✕</button>
            <img id="modalImage" src="" alt="Design" style="width: 100%; height: auto; margin-bottom: 1rem; border-radius: 8px;">
            <h2 id="modalTitle" style="font-size: 20px; margin-bottom: 0.5rem;"></h2>
            <p id="modalCategory" style="font-size: 12px; color: #666; margin-bottom: 1.5rem;"></p>
            <button class="btn-primary" onclick="closeImageModal(); openModal('font', {}, 0)" style="width: 100%; padding: 1rem; background: #2d5016; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: 600;">Zur Schrift-Vorschau</button>
        </div>
    </div>

    <!-- Modal -->
    <div id="modal" class="modal">
        <div class="modal-content">
            <button class="modal-close" onclick="closeModal()">✕</button>
            
            <!-- Step 1: Font Selection with Text Preview -->
            <div id="step1" class="modal-step active">
                <h2>🔤 Schrift Live-Vorschau</h2>
                
                <div style="background: #f9f9f9; padding: 1.5rem; border-radius: 8px; margin-bottom: 2rem;">
                    <label style="display: block; margin-bottom: 0.5rem; font-weight: 600; color: #333; font-size: 14px;">Dein Text (zum Testen):</label>
                    <input type="text" id="customText" placeholder="z.B. HEINZ, Haus Müller, Mein Haustier..." 
                           style="width: 100%; padding: 0.75rem; border: 2px solid #2d5016; border-radius: 6px; font-size: 16px; font-family: inherit;">
                    
                    <div id="livePreview" style="font-size: 64px; font-weight: 400; margin-top: 1.5rem; padding: 2rem; background: white; border-radius: 6px; text-align: center; min-height: 150px; display: flex; align-items: center; justify-content: center; word-break: break-word; border: 1px solid #e0e0e0;">
                        HEINZ
                    </div>
                </div>

                <div style="background: #f0f8f0; padding: 1.5rem; border-radius: 8px; margin-bottom: 2rem; border-left: 4px solid #2d5016;">
                    <strong style="display: block; margin-bottom: 1rem; color: #2d5016;">Komplettes Alphabet & Zahlen:</strong>
                    <div id="alphabetPreview" style="font-size: 24px; line-height: 1.8; word-break: break-word;">
                        ABCDEFGHIJKLMNOPQRSTUVWXYZ abcdefghijklmnopqrstuvwxyz 0123456789 !@#$%^&*()
                    </div>
                </div>

                <div id="fontNameDisplay" style="text-align: center; margin-bottom: 1.5rem;">
                    <strong id="selectedFontName" style="font-size: 18px; color: #2d5016;"></strong>
                </div>

                <div class="modal-buttons">
                    <button class="btn-secondary" onclick="closeModal()">Abbrechen</button>
                    <button class="btn-primary" onclick="nextStep()" id="nextBtn">Diese Schrift auswählen</button>
                </div>
            </div>

            <!-- Step 2: Order Form -->
            <div id="step2" class="modal-step">
                <h2>Bestellung abschließen</h2>
                <div id="selection-summary" style="background: #e8f5e9; margin-bottom: 1.5rem; padding: 1rem; border-radius: 8px; border-left: 4px solid #2d5016;">
                    <!-- Selected items shown here -->
                </div>
                <form class="order-form" id="orderForm" onsubmit="submitOrder(event)">
                    <div class="form-group">
                        <label>Name *</label>
                        <input type="text" name="name" required>
                    </div>
                    <div class="form-group">
                        <label>Email</label>
                        <input type="email" name="email">
                    </div>
                    <div class="form-group">
                        <label>Telefon</label>
                        <input type="tel" name="phone">
                    </div>
                    <div class="form-group">
                        <label>Nachricht / Spezialwünsche</label>
                        <textarea name="message" placeholder="Hier können Sie Ihre Wünsche eingeben..."></textarea>
                    </div>
                    <div class="modal-buttons">
                        <button type="button" class="btn-secondary" onclick="previousStep()">Zurück</button>
                        <button type="submit" class="btn-primary">Bestellung senden</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script>
        // Google Fonts Configuration
        const FONTS = [
            { name: "Montserrat", family: "Montserrat, sans-serif", desc: "universell, modern, Schilder, Alu, Holz", sample: "The quick brown fox" },
            { name: "Bebas Neue", family: "Bebas Neue, cursive", desc: "kräftige Headlines, Caps, Werkstatt", sample: "BOLD & STRONG" },
            { name: "Oswald", family: "Oswald, sans-serif", desc: "schmal, technisch, kleine Flächen", sample: "SLIM & TIGHT" },
            { name: "Libre Franklin", family: "Libre Franklin, sans-serif", desc: "sehr sauber, hochwertig, Produktbeschriftungen", sample: "Clean & Premium" },
            { name: "Braah One", family: "Braah One, cursive", desc: "kräftig, modern, sehr gut gravierbar", sample: "POWER TEXT" },
            { name: "Lilita One", family: "Lilita One, cursive", desc: "Caps, Geschenkartikel, plakativ", sample: "FUN & BOLD" },
            { name: "Playfair Display", family: "Playfair Display, serif", desc: "elegant, Holz, Hochzeit, Namen", sample: "Elegant & Timeless" },
            { name: "Great Vibes", family: "Great Vibes, cursive", desc: "elegante Namen und Geschenkartikel", sample: "Beautiful Script" },
            { name: "Lobster", family: "Lobster, cursive", desc: "dekorative Namen und persönliche Geschenke", sample: "Decorative Style" },
            { name: "Bona Nova", family: "Bona Nova, serif", desc: "klassisch und hochwertig", sample: "Classic & Noble" },
            { name: "Boogaloo", family: "Boogaloo, cursive", desc: "locker, auffällig, Geschenkartikel", sample: "Fun & Playful" },
            { name: "Pacifico", family: "Pacifico, cursive", desc: "handschriftlich, Namen, Freizeitdesign", sample: "Relaxed Handwriting" },
            { name: "Roboto Slab", family: "Roboto Slab, serif", desc: "robust, sehr gut lesbar", sample: "Strong & Readable" },
            { name: "Fredoka", family: "Fredoka, sans-serif", desc: "rund, freundlich, Kinder-/Tiermotive", sample: "Friendly & Round" },
            { name: "Bubblegum Sans", family: "Bubblegum Sans, cursive", desc: "verspielt, Tiere, Kinderartikel", sample: "Playful & Sweet" },
            { name: "Lily Script One", family: "Lily Script One, cursive", desc: "weiche Schreibschrift", sample: "Soft Handwriting" },
            { name: "Limelight", family: "Limelight, cursive", desc: "Art-déco, Retro-Schilder", sample: "ART DECO STYLE" },
            { name: "Libre Caslon Text", family: "Libre Caslon Text, serif", desc: "klassisch, edle Holzprodukte", sample: "Refined Classic" },
            { name: "Anton", family: "Anton, sans-serif", desc: "extrem kräftige Headlines", sample: "ULTRA BOLD" },
            { name: "Cinzel", family: "Cinzel, serif", desc: "Wappen, Familiennamen, traditionelle Designs", sample: "ROYAL & ELEGANT" },
            { name: "Cinzel Decorative", family: "Cinzel Decorative, cursive", desc: "dekorative Wappen und historische Optik", sample: "ORNATE & GRAND" },
            { name: "Permanent Marker", family: "Permanent Marker, cursive", desc: "handgemacht, rustikal", sample: "Hand Drawn" },
            { name: "Special Elite", family: "Special Elite, cursive", desc: "Schreibmaschinen-/Vintage-Look", sample: "Vintage Typewriter" },
            { name: "Rye", family: "Rye, cursive", desc: "Western, Grill, Holzschilder", sample: "WILD WEST" },
            { name: "Alfa Slab One", family: "Alfa Slab One, cursive", desc: "Retro, massive Gravur", sample: "RETRO HEAVY" },
            { name: "Black Ops One", family: "Black Ops One, cursive", desc: "Motorsport, Werkstatt, Männergeschenke", sample: "MILITARY STRONG" },
            { name: "Poppins", family: "Poppins, sans-serif", desc: "modern, sehr sauber", sample: "Modern & Clean" },
            { name: "Raleway", family: "Raleway, sans-serif", desc: "elegant-modern", sample: "Elegant Modern" },
            { name: "League Spartan", family: "League Spartan, sans-serif", desc: "Logos und kräftige Beschriftungen", sample: "BOLD GEOMETRIC" },
            { name: "Orbitron", family: "Orbitron, sans-serif", desc: "futuristisch, technisch", sample: "FUTURE TECH" }
        ];

        const CONFIG = {
            GOOGLE_API_KEY: "AIzaSyBdzRgllKmDQzHeMaeAHzJpvqHOihWpRr4",
            LOGO_FOLDER_ID: "1REBMgt9gJepkNKkknX_Y1tnL1QknCxI1",
            MAIN_FOLDER_ID: "12OdcNV5wB5S1H471D0F8th9EJ2LFrJ6G",
            FORMSPREE_KEY: "xzebgwlg"
        };

        let allDesigns = [];
        let allCategories = [];
        let favorites = [];
        let selectedFont = null;
        let currentCategory = "all";

        // Initialize
        document.addEventListener("DOMContentLoaded", () => {
            loadFavorites();
            loadLogo();
            loadContent("all");
            setupNavigation();
        });

        // Setup Navigation - dynamisch aus Google Drive Ordnern
        async function setupNavigation() {
            // Lade alle Ordner-Namen
            try {
                const folders = await fetchGoogleDriveFiles(CONFIG.MAIN_FOLDER_ID);
                allCategories = folders
                    .filter(f => f.mimeType === "application/vnd.google-apps.folder" && 
                             !f.name.includes("LOGO") && 
                             !f.name.includes("Schriften") &&
                             !f.name.includes("Fonts"))
                    .map(f => f.name)
                    .sort();
            } catch (e) {
                console.log("Categories loading error:", e);
            }
            
            // Baue Navigation dynamisch auf
            const nav = document.querySelector("nav");
            nav.innerHTML = '';
            
            // Button: Alle Designs
            let html = '<button class="nav-btn active" data-category="all">Alle Designs</button>';
            
            // Buttons: Jede Kategorie
            allCategories.forEach(category => {
                html += `<button class="nav-btn" data-category="${category}">${category}</button>`;
            });
            
            // Button: Schriften
            html += '<button class="nav-btn" data-category="schriften">🔤 Schriften</button>';
            
            // Button: Favoriten
            html += '<button class="nav-btn" data-category="favorites">❤️ Favoriten</button>';
            
            nav.innerHTML = html;
            
            // Event-Listener für alle Buttons
            document.querySelectorAll(".nav-btn").forEach(btn => {
                btn.addEventListener("click", () => {
                    document.querySelectorAll(".nav-btn").forEach(b => b.classList.remove("active"));
                    btn.classList.add("active");
                    currentCategory = btn.dataset.category;
                    loadContent(currentCategory);
                });
            });
        }

        // Load Logo
        async function loadLogo() {
            try {
                const files = await fetchGoogleDriveFiles(CONFIG.LOGO_FOLDER_ID);
                
                if (files && files.length > 0) {
                    let logoFile = files.find(f => f.name.match(/\.(jpg|jpeg|png|gif|svg)$/i));
                    
                    if (logoFile) {
                        // Google Drive Thumbnail API
                        const logoUrl = `https://drive.google.com/thumbnail?id=${logoFile.id}&sz=w200`;
                        document.getElementById("logo").src = logoUrl;
                        document.getElementById("logo").onerror = function() {
                            console.log("Logo konnte nicht geladen werden");
                        };
                    }
                }
            } catch (e) {
                console.log("Logo error:", e);
            }
        }

        // Load Content
        async function loadContent(category) {
            const content = document.getElementById("content");
            
            if (category === "all") {
                content.innerHTML = '<div class="loading"><span class="spinner"></span>Lade Inhalte...</div>';
                await loadAllContent();
                renderAllContent();
            } else if (allCategories.includes(category)) {
                // Einzelne Kategorie laden
                content.innerHTML = '<div class="loading"><span class="spinner"></span>Lade Designs...</div>';
                await loadCategoryContent(category);
                renderCategoryContent(category);
            } else if (category === "schriften") {
                renderFonts();
            } else if (category === "favorites") {
                renderFavorites();
            }
        }

        // Load All Content
        async function loadAllContent() {
            try {
                allDesigns = []; // Leere alte Designs
                const folders = await fetchGoogleDriveFiles(CONFIG.MAIN_FOLDER_ID);
                
                // Lade nur echte Design-Ordner (nicht LOGO, nicht Schriften)
                for (const folder of folders) {
                    if (folder.mimeType === "application/vnd.google-apps.folder" && 
                        !folder.name.includes("LOGO") && 
                        !folder.name.includes("Schriften") &&
                        !folder.name.includes("Fonts")) {
                        
                        const images = await fetchGoogleDriveFiles(folder.id);
                        for (const img of images) {
                            if (img.name.match(/\.(jpg|jpeg|png|gif)$/i)) {
                                allDesigns.push({
                                    id: img.id,
                                    name: img.name.replace(/\.[^/.]+$/, ""),
                                    category: folder.name,
                                    url: `https://drive.google.com/thumbnail?id=${img.id}&sz=w600`
                                });
                            }
                        }
                    }
                }
            } catch (e) {
                console.log("Content loading error:", e);
            }
        }

        // Load Single Category Content
        async function loadCategoryContent(categoryName) {
            try {
                allDesigns = []; // Leere alte Designs
                const folders = await fetchGoogleDriveFiles(CONFIG.MAIN_FOLDER_ID);
                const categoryFolder = folders.find(f => f.name === categoryName);
                
                if (categoryFolder) {
                    const images = await fetchGoogleDriveFiles(categoryFolder.id);
                    for (const img of images) {
                        if (img.name.match(/\.(jpg|jpeg|png|gif)$/i)) {
                            allDesigns.push({
                                id: img.id,
                                name: img.name.replace(/\.[^/.]+$/, ""),
                                category: categoryName,
                                url: `https://drive.google.com/thumbnail?id=${img.id}&sz=w600`
                            });
                        }
                    }
                }
            } catch (e) {
                console.log("Category loading error:", e);
            }
        }
        
        // Render Single Category
        function renderCategoryContent(categoryName) {
            const content = document.getElementById("content");
            const designs = allDesigns.filter(d => d.category === categoryName);
            
            let html = `<h2 class="category-title">${categoryName}</h2><div class="grid-5">`;
            designs.forEach(item => {
                html += renderDesignCard(item);
            });
            html += `</div>`;
            
            content.innerHTML = html || '<p style="text-align: center; padding: 2rem;">Keine Designs gefunden</p>';
            attachEventListeners();
        }

        // Fetch Google Drive Files
        async function fetchGoogleDriveFiles(folderId) {
            try {
                const response = await fetch(
                    `https://www.googleapis.com/drive/v3/files?q='${folderId}'+in+parents&key=${CONFIG.GOOGLE_API_KEY}&fields=files(id,name,mimeType,size)`
                );
                
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                const data = await response.json();
                return data.files || [];
            } catch (e) {
                console.log("API Error:", e);
                return [];
            }
        }

        // Render All Content
        function renderAllContent() {
            const content = document.getElementById("content");
            let html = "";

            if (allDesigns.length > 0) {
                html += '<h2 class="category-title">Design-Kategorien</h2>';
                const grouped = {};
                allDesigns.forEach(d => {
                    if (!grouped[d.category]) grouped[d.category] = [];
                    grouped[d.category].push(d);
                });

                for (const [category, items] of Object.entries(grouped)) {
                    html += `<h3 style="font-size: 18px; color: #2d5016; margin-top: 2rem; margin-bottom: 1rem;">${category}</h3>`;
                    html += `<div class="grid-5">`;
                    items.forEach(item => {
                        html += renderDesignCard(item);
                    });
                    html += `</div>`;
                }
            }

            html += '<h2 class="category-title" style="margin-top: 3rem;">🔤 Verfügbare Schriften</h2>';
            html += `<div class="grid-5">`;
            FONTS.forEach((font, i) => {
                html += renderFontCard(font, i);
            });
            html += `</div>`;

            content.innerHTML = html || '<p style="text-align: center; padding: 2rem; color: #999;">Keine Inhalte verfügbar</p>';
            attachEventListeners();
        }

        // Render Designs
        function renderDesigns() {
            const content = document.getElementById("content");
            const grouped = {};
            
            allDesigns.forEach(d => {
                if (!grouped[d.category]) grouped[d.category] = [];
                grouped[d.category].push(d);
            });

            let html = "";
            for (const [category, items] of Object.entries(grouped)) {
                html += `<h2 class="category-title">${category}</h2>`;
                html += `<div class="grid-5">`;
                items.forEach(item => {
                    html += renderDesignCard(item);
                });
                html += `</div>`;
            }

            content.innerHTML = html || '<p style="text-align: center; padding: 2rem;">Keine Designs gefunden</p>';
            attachEventListeners();
        }

        // Render Fonts
        function renderFonts() {
            const content = document.getElementById("content");
            
            let html = '<h2 class="category-title">🔤 Verfügbare Schriften (30)</h2><div class="grid-5">';
            FONTS.forEach((font, i) => {
                html += renderFontCard(font, i);
            });
            html += '</div>';
            
            content.innerHTML = html;
            attachEventListeners();
        }

        // Render Design Card
        function renderDesignCard(design) {
            const isFavorite = favorites.includes(design.id);
            return `
                <div class="design-card" onclick="openImageModal('${design.id}', '${design.name}', '${design.category}')">
                    <button class="favorite-btn" onclick="toggleFavorite(event, '${design.id}'); return false;">
                        ${isFavorite ? "❤️" : "🤍"}
                    </button>
                    <img src="${design.url}" alt="${design.name}" onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22400%22 height=%22400%22%3E%3Crect fill=%22%23f0f0f0%22 width=%22400%22 height=%22400%22/%3E%3C/svg%3E'">
                    <div class="info">
                        <div class="name">${design.name}</div>
                        <div class="description">${design.category}</div>
                    </div>
                </div>
            `;
        }

        // Render Font Card
        function renderFontCard(font, index) {
            return `
                <div class="font-card" onclick="openModal('font', ${JSON.stringify(font).replace(/"/g, '&quot;')}, ${index})">
                    <div class="preview">
                        <div style="font-family: ${font.family}; font-size: 32px; font-weight: 400; letter-spacing: 0.5px; line-height: 1.4; word-break: break-word; padding: 1rem; text-align: center;">${font.sample}</div>
                    </div>
                    <div class="info">
                        <div class="name">${font.name}</div>
                        <div class="description">Schrift #${index + 1}</div>
                    </div>
                </div>
            `;
        }

        // Store selected design
        let selectedDesign = {
            id: null,
            name: null,
            fullPath: null
        };

        // Step 1: Open Image Preview Modal
        function openImageModal(imageId, imageName, fullPath) {
            console.log('openImageModal called:', imageId, imageName, fullPath);
            selectedDesign = {
                id: imageId,
                name: imageName,
                fullPath: fullPath
            };
            
            const modalImg = document.getElementById('modalImage');
            const modalTitle = document.getElementById('modalTitle');
            const modalCat = document.getElementById('modalCategory');
            const imageModal = document.getElementById('imageModal');
            
            if (modalImg) modalImg.src = `https://drive.google.com/thumbnail?id=${imageId}&sz=w1000`;
            if (modalTitle) modalTitle.textContent = imageName;
            if (modalCat) modalCat.textContent = fullPath;
            
            if (imageModal) {
                imageModal.classList.add('active');
                console.log('imageModal active class added');
            }
        }

        function closeImageModal() {
            document.getElementById('imageModal').classList.remove('active');
        }

        // Open Modal with Font Preview
        function openModal(type, font, index) {
            const modal = document.getElementById("modal");
            selectedFont = { ...font, index: index + 1, customText: "HEINZ" };
            
            // Setup text input
            const textInput = document.getElementById("customText");
            textInput.value = "HEINZ";
            textInput.oninput = updateLivePreview;
            
            // Display font name
            document.getElementById("selectedFontName").textContent = `${font.name} (#${index + 1})`;
            
            // Update previews
            updateLivePreview();
            
            document.getElementById("step1").classList.add("active");
            document.getElementById("step2").classList.remove("active");
            modal.classList.add("active");
        }

        // Update Live Preview
        function updateLivePreview() {
            const text = document.getElementById("customText").value || "HEINZ";
            selectedFont.customText = text;
            
            const preview = document.getElementById("livePreview");
            const alphabet = document.getElementById("alphabetPreview");
            
            preview.style.fontFamily = selectedFont.family;
            alphabet.style.fontFamily = selectedFont.family;
            
            preview.textContent = text;
            alphabet.textContent = "ABCDEFGHIJKLMNOPQRSTUVWXYZ abcdefghijklmnopqrstuvwxyz 0123456789 !@#$%^&*()";
        }

        // Next Step
        function nextStep() {
            if (!selectedFont) return;
            
            document.getElementById("step1").classList.remove("active");
            document.getElementById("step2").classList.add("active");
            
            const summary = document.getElementById("selection-summary");
            summary.innerHTML = `
                <strong style="display: block; margin-bottom: 0.5rem;">✅ Gewählte Schrift:</strong>
                <div style="font-family: ${selectedFont.family}; font-size: 48px; margin-bottom: 1rem; line-height: 1.4; word-break: break-word;">${selectedFont.customText}</div>
                <div style="font-size: 14px; color: #666;">
                    <strong>${selectedFont.name}</strong> (Schrift #${selectedFont.index})<br>
                    <span style="font-size: 12px;">Dein Text: "${selectedFont.customText}"</span>
                </div>
            `;
        }

        // Previous Step
        function previousStep() {
            document.getElementById("step1").classList.add("active");
            document.getElementById("step2").classList.remove("active");
        }

        // Close Modal
        function closeModal() {
            document.getElementById("modal").classList.remove("active");
            selectedFont = null;
        }

        // Submit Order
        async function submitOrder(e) {
            e.preventDefault();
            
            const formData = new FormData(e.target);
            const data = {
                name: formData.get("name"),
                email: formData.get("email"),
                phone: formData.get("phone"),
                message: formData.get("message"),
                selectedFont: `${selectedFont.name} (#${selectedFont.index})`,
                customText: selectedFont.customText
            };

            try {
                const response = await fetch(`https://formspree.io/f/${CONFIG.FORMSPREE_KEY}`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(data)
                });

                if (response.ok) {
                    alert("✅ Bestellung gesendet! Wir melden uns bald bei Ihnen.");
                    closeModal();
                    e.target.reset();
                } else {
                    alert("❌ Fehler beim Senden. Bitte versuchen Sie es später erneut.");
                }
            } catch (err) {
                alert("❌ Fehler: " + err.message);
            }
        }

        // Favorites
        function loadFavorites() {
            const saved = localStorage.getItem("timberart-favorites");
            favorites = saved ? JSON.parse(saved) : [];
        }

        function saveFavorites() {
            localStorage.setItem("timberart-favorites", JSON.stringify(favorites));
        }

        function toggleFavorite(e, id) {
            e.stopPropagation();
            if (favorites.includes(id)) {
                favorites = favorites.filter(f => f !== id);
            } else {
                favorites.push(id);
            }
            saveFavorites();
            loadContent(currentCategory);
        }

        function renderFavorites() {
            const content = document.getElementById("content");
            if (favorites.length === 0) {
                content.innerHTML = '<p style="text-align: center; padding: 2rem; color: #999;">Keine Favoriten gespeichert</p>';
                return;
            }

            let html = '<h2 class="category-title">❤️ Meine Favoriten</h2><div class="grid-5">';
            allDesigns.forEach(design => {
                if (favorites.includes(design.id)) {
                    html += renderDesignCard(design);
                }
            });
            html += '</div>';
            
            content.innerHTML = html;
            attachEventListeners();
        }

        function attachEventListeners() {
            // Events already attached via onclick
        }

        // Close modals on ESC key
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                closeImageModal();
                closeModal();
            }
        });
    </script>
</body>
</html>
